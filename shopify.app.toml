# Shopify app configuration. `shopify app config link` fills in client_id, and
# `shopify app dev` keeps application_url pointing at the current tunnel.
name = "einvoice-kit"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://REPLACE_WITH_APP_HOST/"
embedded = true

[build]
automatically_update_urls_on_dev = true

[auth]
# The app logs in with token exchange, which needs no redirects, but Shopify CLI
# requires the section. `shopify app dev` moves this address to the tunnel.
redirect_urls = ["https://REPLACE_WITH_APP_HOST/auth/callback"]

[access_scopes]
# The app reads orders, refunds and the customer's billing details, and writes
# only one thing: a copy of each order's invoices into a field on that order.
scopes = "read_orders,write_orders"

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["orders/paid", "orders/updated", "refunds/create", "app/uninstalled"]
uri = "/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks"
